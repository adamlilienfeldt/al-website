<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adam Lilienfeldt Shine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300..600&display=swap">
<style>
/* Layout: a slim sticky bar, then a contact sheet: covers in a hairline-ruled grid
   (shared rules, no gaps, no cards); headline albums take a 2×2 cell. The covers are the colour. */
:root {
  --bg: #fbfbfc;
  --fg: #16171a;
  --muted: #7d8089;
  --line: #dfe0e4;
  --veil: rgba(251, 251, 252, .94);
  --font: "Helvetica Neue", "Inter", Helvetica, Arial, sans-serif;
  --pad: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111214; --fg: #ececee; --muted: #8a8d96; --line: #2a2c31; --veil: rgba(17, 18, 20, .93);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111214; --fg: #ececee; --muted: #8a8d96; --line: #2a2c31; --veil: rgba(17, 18, 20, .93);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: 13px;
  line-height: 1.45;
  font-weight: 400;
  -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; z-index: 10;
  height: env(safe-area-inset-top, 0px); background: var(--bg);
}
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 1px solid var(--fg); outline-offset: 2px; }

/* ── Bar ──────────────────────────────────────────────── */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--bg);
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: baseline;
  gap: 8px 24px;
  padding-block: 18px 14px;
}
.name { font-weight: 500; letter-spacing: -.005em; white-space: nowrap; }
.bio { color: var(--muted); min-width: 0; }
.nav { display: flex; gap: 18px; }
.nav a, .nav button { color: var(--muted); }
.nav a:hover, .nav button:hover, .nav [aria-current="true"] { color: var(--fg); }
.contact-line { grid-column: 1 / -1; display: flex; gap: 12px; align-items: baseline; color: var(--muted); }
.contact-line .email { color: var(--fg); user-select: all; }
.contact-line button { color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
@media (max-width: 640px) {
  .bar { grid-template-columns: 1fr auto; }
  .bio { grid-column: 1 / -1; grid-row: 2; }
}

/* ── Filter ───────────────────────────────────────────── */
.filter {
  display: flex; flex-wrap: wrap; gap: 4px 18px;
  padding-block: 22px 12px;
  border-top: 1px solid var(--line);
}
.filter button { color: var(--muted); }
.filter button:hover { color: var(--fg); }
.filter button[aria-pressed="true"] { color: var(--fg); }
.filter sup { font-size: 9px; margin-left: 2px; font-variant-numeric: tabular-nums; }

/* ── Contact sheet ────────────────────────────────────── */
.sheet {
  list-style: none; margin: 0; padding: 0;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(200px, 50% - 1px), 1fr));
  grid-auto-flow: row dense;
  border-top: 1px solid var(--line);
  border-left: 1px solid var(--line);
}
.cell {
  position: relative;
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  padding: var(--pad);
  display: flex; flex-direction: column; gap: 10px;
  min-width: 0;
}
.cell[hidden] { display: none !important; }
@media (min-width: 700px) {
  .cell.large { grid-column: span 2; grid-row: span 2; }
}
.art {
  position: relative; display: block; width: 100%; max-width: 100%;
  aspect-ratio: 1; overflow: hidden; background: var(--line);
}
.art img { display: block; width: 100%; height: 100%; object-fit: cover; }
.film .art { aspect-ratio: 3 / 2; }
.links {
  position: absolute; inset: 0;
  background: var(--veil);
  display: flex; flex-direction: column; justify-content: flex-end; gap: 2px;
  padding: var(--pad);
  opacity: 0; visibility: hidden;
  transition: opacity .18s ease, visibility 0s linear .18s;
}
.cell.open .links { opacity: 1; visibility: visible; transition: opacity .18s ease; }
.links a { padding: 3px 0; display: flex; justify-content: space-between; }
.links a:hover { text-decoration: underline; text-underline-offset: 3px; }
.links a span { color: var(--muted); }
.cap { display: grid; gap: 1px; margin-top: auto; }
.cap .t { font-weight: 500; overflow-wrap: anywhere; }
.cap .a { overflow-wrap: anywhere; }
.cap .r { color: var(--muted); margin-top: 6px; font-size: 11.5px; overflow-wrap: anywhere; }
.large .cap .t { font-size: 15px; }

.section-label {
  display: flex; justify-content: space-between; gap: 12px;
  padding-block: 40px 12px; color: var(--muted);
}
.section-label h2 { margin: 0; font-size: 13px; font-weight: 500; color: var(--fg); }

footer {
  display: flex; flex-wrap: wrap; gap: 18px; justify-content: space-between;
  padding-block: 40px 0; color: var(--muted);
}
footer a:hover { color: var(--fg); }

.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

@media (prefers-reduced-motion: reduce) {
  .links, .cell.open .links { transition: none; }
}
</style>
</head>

    if (r.link) svc.push(`<a href="${esc(r.link)}" target="_blank" rel="noopener">all platforms<span>↗</span></a>`);
    const meta = [r.credits, r.label].filter(Boolean).map(esc).join(' · ');
    return `<li class="cell${isLarge(r) ? ' large' : ''}" data-roles="${rolesOf(r).join(' ')}">
      <button class="art" type="button" aria-expanded="false" aria-controls="l${i}" aria-label="${esc(r.title)} by ${esc(r.artist)}, show listening links">
        ${r.cover ? `<img src="${esc(r.cover)}" alt="" width="720" height="720" loading="${i < 10 ? 'eager' : 'lazy'}" decoding="async">` : ''}
      </button>
      <div class="links" id="l${i}">${svc.join('')}</div>
      <div class="cap">
        <span class="t">${esc(r.title)}</span>
        <span class="a">${esc(r.artist)}</span>
        <span class="r">${meta}</span>
      </div>
    </li>`;
  }).join('');
  const sheet = document.getElementById('releases');
  sheet.innerHTML = cells;

  // The links veil sits inside .art's box; position it over the art.
  sheet.querySelectorAll('.cell').forEach(c => {
    const art = c.querySelector('.art'), links = c.querySelector('.links');
    art.appendChild(links);
  });

  // ── Filter
  const filter = document.getElementById('music');
  const all = [...sheet.children];
  const count = k => all.filter(c => c.dataset.roles.split(' ').includes(k)).length;
  const keys = ['all', ...Object.keys(ROLES)];
  filter.innerHTML = keys.map(k =>
    `<button type="button" data-k="${k}" aria-pressed="${k === 'all'}">${k}<sup>${k === 'all' ? all.length : count(k)}</sup></button>`).join('');
  filter.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const k = b.dataset.k;
    filter.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    all.forEach(c => { c.hidden = k !== 'all' && !c.dataset.roles.split(' ').includes(k); });
    closeAll();
  });

  // ── Tap a cover to reveal its links in place
  function closeAll(except) {
    sheet.querySelectorAll('.cell.open').forEach(c => {
      if (c === except) return;
      c.classList.remove('open'); c.querySelector('.art').setAttribute('aria-expanded', 'false');
    });
  }
  sheet.addEventListener('click', e => {
    if (e.target.closest('.links a')) return;
    const art = e.target.closest('.art'); if (!art) return;
    e.preventDefault();
    const cell = art.closest('.cell');
    closeAll(cell);
    const open = cell.classList.toggle('open');
    art.setAttribute('aria-expanded', String(open));
  });
  document.addEventListener('click', e => { if (!e.target.closest('.cell')) closeAll(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeAll(); });

  // ── Film
  document.getElementById('films').innerHTML = D.film.map(f => `<li class="cell film">
      ${f.link ? `<a class="art" href="${esc(f.link)}" target="_blank" rel="noopener" aria-label="Watch ${esc(f.title)} on Vimeo">` : `<div class="art">`}
        <img src="${esc(f.cover)}" alt="" loading="lazy" decoding="async">
      ${f.link ? `</a>` : `</div>`}
      <div class="cap">
        <span class="t">${esc(f.title)}</span>
        <span class="a">dir. ${esc(f.director)}</span>
        <span class="r">${esc(f.role)} · ${esc(f.company)}</span>
      </div>
    </li>`).join('');
  document.getElementById('filmCount').textContent = D.film.length;

  // ── Contact reveals the address inline
  const cBtn = document.getElementById('contactBtn'), cLine = document.getElementById('contactLine');
  cBtn.addEventListener('click', () => {
    cLine.hidden = !cLine.hidden; cBtn.setAttribute('aria-expanded', String(!cLine.hidden));
  });
  document.getElementById('copyEmail').addEventListener('click', async e => {
    const btn = e.currentTarget, el = document.getElementById('email');
    try { await navigator.clipboard.writeText(el.textContent); btn.textContent = 'copied'; }
    catch { const s = getSelection(), r = document.createRange(); r.selectNodeContents(el); s.removeAllRanges(); s.addRange(r); btn.textContent = 'selected'; }
    setTimeout(() => { btn.textContent = 'copy'; }, 1600);
  });

  // ── Nav state follows scroll position
  const navLinks = document.querySelectorAll('.nav a');
  const filmTop = () => document.getElementById('film').getBoundingClientRect().top;
  addEventListener('scroll', () => {
    const inFilm = filmTop() < innerHeight * .5;
    navLinks.forEach(a => a.setAttribute('aria-current', String(a.hash === (inFilm ? '#film' : '#music'))));
  }, { passive: true });
})();
</script>
</body>
</html>
